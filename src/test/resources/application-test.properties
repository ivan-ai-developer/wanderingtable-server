# Профиль интеграционных тестов. Datasource подставляется Testcontainers через @ServiceConnection,
# поэтому spring.datasource.* здесь намеренно отсутствует.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Фиксированный секрет: тестовый контекст не должен зависеть от .env / переменных окружения.
# 32 байта в Base64 (HS256 требует ключ не короче 256 бит).
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtaHMyNTYtMzJieXRlcyE=

app.bootstrap.club-manager-email=

# Все тесты идут с одного IP (127.0.0.1) через общий бин лимитера, поэтому реальный лимит
# здесь снят — поведение самого лимитера проверяется отдельным unit-тестом.
app.rate-limit.register.max-requests=100000

logging.level.org.hibernate.SQL=warn
